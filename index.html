<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#2563eb">

<title>VarthaNow — Latest News</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;

    --primary:#2563eb;
    --primary2:#4f46e5;

    --nav:#ffffff;

    --shadow:0 8px 30px rgba(15,23,42,.07);
}

body.dark{
    --bg:#080d18;
    --card:#111827;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#1f2937;

    --primary:#60a5fa;
    --primary2:#818cf8;

    --nav:#111827;

    --shadow:0 8px 30px rgba(0,0,0,.30);
}


/* =========================================================
   BODY
========================================================= */

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:var(--bg);
    color:var(--text);

    min-height:100vh;

    transition:
        background .25s,
        color .25s;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

img{
    display:block;
}


/* =========================================================
   TOP AD
========================================================= */

.top-ad{
    width:100%;
    min-height:50px;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:5px 10px;

    background:var(--bg);

    overflow:hidden;
}


/* =========================================================
   LOGO AREA
========================================================= */

.logo-area{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:14px 20px 18px;

    background:var(--bg);
}

.logo-image{
    display:block;

    width:auto;
    max-width:340px;
    height:auto;

    max-height:105px;

    object-fit:contain;

    border-radius:10px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;

    z-index:50;

    background:rgba(245,247,251,.88);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);
}

body.dark .header{
    background:rgba(8,13,24,.88);
}

.header-inner{
    max-width:1200px;

    height:64px;

    margin:auto;

    padding:0 20px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.header-brand{
    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;
}

.header-brand span{
    color:var(--primary);
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;

    border-radius:13px;

    background:var(--card);

    color:var(--text);

    border:1px solid var(--border);

    display:grid;
    place-items:center;

    font-size:18px;

    transition:.2s;
}

.icon-btn:active{
    transform:scale(.94);
}


/* =========================================================
   MAIN
========================================================= */

.app{
    max-width:1200px;

    margin:auto;

    padding-bottom:100px;
}

main{
    padding:28px 20px 40px;
}


/* =========================================================
   GREETING
========================================================= */

.greeting{
    margin-bottom:20px;
}

.greeting small{
    color:var(--muted);

    font-size:12px;

    font-weight:700;

    letter-spacing:.7px;
}

.greeting h1{
    font-size:32px;

    line-height:1.15;

    margin-top:5px;

    letter-spacing:-1.2px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{
    display:flex;

    align-items:center;

    gap:10px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:17px;

    padding:12px 15px;

    margin-bottom:20px;

    box-shadow:var(--shadow);
}

.search-icon{
    color:var(--muted);

    font-size:21px;
}

.search-box input{
    flex:1;

    border:0;

    outline:0;

    background:transparent;

    color:var(--text);

    font-size:15px;
}

.search-box input::placeholder{
    color:var(--muted);
}


/* =========================================================
   CATEGORIES
========================================================= */

.categories{
    display:flex;

    gap:9px;

    overflow-x:auto;

    padding-bottom:8px;

    margin-bottom:25px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:none;

    padding:10px 16px;

    border-radius:30px;

    background:var(--card);

    border:1px solid var(--border);

    color:var(--muted);

    font-size:13px;

    font-weight:750;

    transition:.2s;
}

.category:active{
    transform:scale(.95);
}

.category.active{
    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    border-color:transparent;

    box-shadow:
        0 6px 18px
        rgba(37,99,235,.22);
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}

.section-head h2{
    font-size:20px;

    letter-spacing:-.5px;
}

.refresh-btn{
    display:flex;

    align-items:center;

    gap:5px;

    background:none;

    color:var(--primary);

    font-weight:750;

    font-size:13px;
}


/* =========================================================
   FEATURED
========================================================= */

.featured{
    position:relative;

    overflow:hidden;

    height:400px;

    margin-bottom:30px;

    border-radius:23px;

    background:#111827;

    box-shadow:var(--shadow);

    cursor:pointer;
}

.featured img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:transform .5s;
}

.featured:hover img{
    transform:scale(1.04);
}

.featured::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.88),
            rgba(0,0,0,.25) 60%,
            transparent
        );
}

.featured-content{
    position:absolute;

    z-index:2;

    left:0;
    right:0;
    bottom:0;

    padding:25px;

    color:#fff;
}

.breaking{
    display:inline-flex;

    align-items:center;

    gap:7px;

    background:rgba(239,68,68,.95);

    padding:6px 10px;

    border-radius:8px;

    font-size:10px;

    font-weight:850;

    text-transform:uppercase;

    margin-bottom:11px;
}

.breaking i{
    width:6px;
    height:6px;

    background:#fff;

    border-radius:50%;

    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        opacity:.3;
    }
}

.featured h2{
    font-size:27px;

    line-height:1.2;

    max-width:800px;

    letter-spacing:-.7px;
}

.featured-meta{
    display:flex;

    gap:9px;

    margin-top:12px;

    color:#d1d5db;

    font-size:12px;
}


/* =========================================================
   NEWS GRID
========================================================= */

.news-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:17px;
}

.news-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:19px;

    overflow:hidden;

    cursor:pointer;

    transition:
        transform .22s,
        box-shadow .22s;

    box-shadow:var(--shadow);
}

.news-card:hover{
    transform:translateY(-4px);
}

.card-image{
    height:190px;

    position:relative;

    overflow:hidden;

    background:#e5e7eb;
}

.card-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:transform .4s;
}

.news-card:hover .card-image img{
    transform:scale(1.05);
}

.bookmark{
    position:absolute;

    right:10px;
    top:10px;

    width:36px;
    height:36px;

    border-radius:11px;

    background:rgba(0,0,0,.55);

    color:#fff;

    display:grid;

    place-items:center;

    backdrop-filter:blur(6px);

    font-size:18px;
}

.card-content{
    padding:16px;
}

.card-category{
    color:var(--primary);

    text-transform:uppercase;

    font-size:10px;

    font-weight:850;

    letter-spacing:.7px;
}

.news-card h3{
    font-size:17px;

    line-height:1.32;

    margin:7px 0;

    letter-spacing:-.3px;
}

.description{
    color:var(--muted);

    font-size:13px;

    line-height:1.5;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.card-meta{
    display:flex;

    justify-content:space-between;

    gap:8px;

    color:var(--muted);

    font-size:11px;

    margin-top:13px;
}


/* =========================================================
   LOADING
========================================================= */

.skeleton{
    background:
        linear-gradient(
            90deg,
            var(--border) 25%,
            rgba(128,128,128,.08) 50%,
            var(--border) 75%
        );

    background-size:200% 100%;

    animation:skeletonMove 1.4s infinite;
}

@keyframes skeletonMove{
    to{
        background-position:-200% 0;
    }
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;

    padding:60px 20px;

    color:var(--muted);

    grid-column:1 / -1;
}

.empty-icon{
    font-size:45px;

    margin-bottom:12px;
}

.empty h3{
    color:var(--text);

    margin-bottom:6px;
}


/* =========================================================
   ARTICLE VIEW
========================================================= */

.article-view{
    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:var(--bg);

    overflow-y:auto;
}

.article-view.active{
    display:block;
}

.article-container{
    max-width:850px;

    margin:auto;

    padding:20px 20px 100px;
}

.article-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.back-btn{
    display:flex;

    align-items:center;

    gap:7px;

    background:var(--card);

    color:var(--text);

    border:1px solid var(--border);

    padding:10px 15px;

    border-radius:12px;

    font-weight:750;
}

.article-category{
    color:var(--primary);

    font-size:11px;

    font-weight:850;

    text-transform:uppercase;

    letter-spacing:.7px;
}

.article-title{
    font-size:41px;

    line-height:1.1;

    letter-spacing:-1.6px;

    margin:8px 0 15px;
}

.article-meta{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    color:var(--muted);

    font-size:13px;

    margin-bottom:20px;
}

.article-image{
    width:100%;

    max-height:520px;

    object-fit:cover;

    border-radius:22px;

    margin-bottom:25px;
}

.article-description{
    font-size:18px;

    line-height:1.75;

    color:var(--text);

    margin-bottom:25px;
}


/* =========================================================
   ARTICLE BUTTONS
========================================================= */

.article-buttons{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:10px;
}

.read-original{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    color:white;

    padding:13px 19px;

    border-radius:13px;

    font-weight:800;

    text-decoration:none;
}

.whatsapp-share{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    background:#25D366;

    color:white;

    padding:13px 19px;

    border-radius:13px;

    font-weight:850;

    text-decoration:none;

    transition:.2s;
}

.whatsapp-share:hover{
    filter:brightness(.95);

    transform:translateY(-1px);
}

.whatsapp-logo{
    width:20px;
    height:20px;

    display:block;
}


/* =========================================================
   BOTTOM AD
========================================================= */

.bottom-ad{
    width:100%;

    min-height:70px;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:10px;

    margin-top:20px;

    overflow:hidden;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;

    z-index:60;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:min(520px,calc(100% - 24px));

    height:68px;

    background:
        rgba(255,255,255,.93);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border:1px solid var(--border);

    border-radius:20px 20px 0 0;

    display:flex;

    align-items:center;

    justify-content:space-around;

    box-shadow:
        0 -8px 30px
        rgba(0,0,0,.08);
}

body.dark .bottom-nav{
    background:rgba(17,24,39,.95);
}

.nav-item{
    background:none;

    color:var(--muted);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:10px;

    font-weight:750;

    min-width:65px;
}

.nav-icon{
    font-size:19px;
}

.nav-item.active{
    color:var(--primary);
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    z-index:200;

    left:50%;

    bottom:85px;

    transform:translate(-50%,20px);

    background:#111827;

    color:#fff;

    padding:11px 17px;

    border-radius:12px;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    white-space:nowrap;
}

.toast.show{
    opacity:1;

    transform:translate(-50%,0);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:850px){

    .news-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .featured{
        height:450px;
    }

    .bottom-nav{
        border-radius:18px;

        bottom:18px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    main{
        padding:22px 14px 35px;
    }

    .header-inner{
        padding:0 14px;
    }

    .logo-area{
        padding:12px 15px 15px;
    }

    .logo-image{
        max-width:300px;
        max-height:90px;
    }

    .header-brand{
        font-size:16px;
    }

    .greeting h1{
        font-size:27px;
    }

    .featured{
        height:335px;

        border-radius:20px;
    }

    .featured-content{
        padding:18px;
    }

    .featured h2{
        font-size:22px;
    }

    .news-grid{
        grid-template-columns:1fr;
    }

    .card-image{
        height:210px;
    }

    .article-title{
        font-size:31px;
    }

    .article-image{
        border-radius:18px;
    }

    .article-buttons{
        flex-direction:column;
    }

    .read-original,
    .whatsapp-share{
        width:100%;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:370px){

    .logo-image{
        max-width:260px;
    }

    .header-brand{
        font-size:15px;
    }

    .greeting h1{
        font-size:24px;
    }

    .featured h2{
        font-size:20px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{
        animation-duration:.01ms !important;

        transition-duration:.01ms !important;
    }

}

</style>

</head>

/* =========================================================

/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews(){

    showLoading();

    const config =
        categoryConfig[currentCategory];

    if(!config){

        showError(
            "Invalid category."
        );

        return;

    }

    try{

        const params =
            new URLSearchParams();

        params.set(
            "apikey",
            API_KEY
        );

        params.set(
            "language",
            "en"
        );

        if(config.country){

            params.set(
                "country",
                config.country
            );

        }

        if(config.category){

            params.set(
                "category",
                config.category
            );

        }

        if(config.query){

            params.set(
                "q",
                config.query
            );

        }

        params.set(
            "image",
            "1"
        );

        params.set(
            "removeduplicate",
            "1"
        );

        const url =
            `${NEWSDATA_BASE}/latest?${params}`;

        console.log(
            "Fetching NewsData.io:",
            url.replace(
                API_KEY,
                "HIDDEN"
            )
        );

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const data =
            await response.json();

        console.log(
            "NewsData response:",
            data
        );

        if(
            data.status &&
            data.status !== "success"
        ){

            let errorMessage =
                "NewsData.io returned an error.";

            if(data.results){

                if(
                    Array.isArray(
                        data.results
                    )
                ){

                    errorMessage =
                        data.results.join(", ");

                }
                else if(
                    typeof data.results === "string"
                ){

                    errorMessage =
                        data.results;

                }

            }

            throw new Error(
                errorMessage
            );

        }

        if(
            !data.results ||
            !Array.isArray(data.results)
        ){

            throw new Error(
                "No news articles returned."
            );

        }

        articles =
            data.results
                .filter(
                    function(article){

                        return article &&
                               article.title;

                    }
                )
                .map(
                    function(article,index){

                        return {

                            id:
                                article.article_id ||
                                `newsdata-${currentCategory}-${index}-${Date.now()}`,

                            category:
                                currentCategory,

                            title:
                                article.title ||
                                "Untitled",

                            description:
                                article.description ||
                                article.content ||
                                "Read the original article for more information.",

                            source:
                                article.source_name ||
                                "News",

                            time:
                                formatTime(
                                    article.pubDate
                                ),

                            image:
                                article.image_url ||
                                FALLBACK_IMAGE,

                            url:
                                article.link ||
                                "#"

                        };

                    }
                );

        renderNews();

        /*
         * If this page was opened from a WhatsApp
         * shared article link, try opening it after
         * the news has loaded.
         */
        checkSharedArticle();

    }
    catch(error){

        console.error(
            "NewsData.io error:",
            error
        );

        showError(
            error.message
        );

    }

}


/* =========================================================
   RENDER NEWS
========================================================= */

function renderNews(){

    const grid =
        document.getElementById(
            "newsGrid"
        );

    const featured =
        document.getElementById(
            "featuredContainer"
        );

    let filtered =
        [...articles];

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();

    if(search){

        filtered =
            filtered.filter(
                function(article){

                    return (

                        article.title
                            .toLowerCase()
                            .includes(search)

                        ||

                        article.description
                            .toLowerCase()
                            .includes(search)

                        ||

                        article.source
                            .toLowerCase()
                            .includes(search)

                    );

                }
            );

    }

    if(filtered.length === 0){

        featured.innerHTML = "";

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    No news found
                </h3>

                <p>
                    Try another search or category.
                </p>

            </div>

        `;

        return;

    }

    const first =
        filtered[0];

    featured.innerHTML = `

        <div
            class="featured"
            onclick="openArticle('${escapeJS(first.id)}')"
        >

            <img
                src="${escapeHTML(first.image)}"
                alt=""
                loading="eager"
                onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'"
            >

            <div class="featured-content">

                <div class="breaking">

                    <i></i>

                    Top Story

                </div>

                <h2>
                    ${escapeHTML(first.title)}
                </h2>

                <div class="featured-meta">

                    <span>
                        ${escapeHTML(first.source)}
                    </span>

                    <span>
                        •
                    </span>

                    <span>
                        ${escapeHTML(first.time)}
                    </span>

                </div>

            </div>

        </div>

    `;

    const rest =
        filtered.slice(1);

    grid.innerHTML =
        rest
            .map(createCard)
            .join("");

}


/* =========================================================

========================================================= */

    return `

        >

            <div class="card-image">

                <img
                    src="${escapeHTML(article.image)}"
                    alt=""
                    loading="lazy"
                    onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'"
                >

                <button
                    class="bookmark"
                    onclick="event.stopPropagation();toggleSave('${escapeJS(article.id)}')"
                    aria-label="Save article"
                >

                    ${isSaved ? "★" : "☆"}

                </button>

            </div>

            <div class="card-content">

                <div class="card-category">

                    ${capitalize(
                        article.category

                </div>

                    ${escapeHTML(
                        article.title

                <p class="description">

                    ${escapeHTML(
                        article.description
                    )}

                </p>

                        ${escapeHTML(

                    </span>

/* =========================================================

========================================================= */

                       String(id);

    }

    const saved =
        savedArticles.includes(
            article.id
        );

    document.getElementById(
        "articleContent"
    ).innerHTML = `

        <div class="article-category">

            ${capitalize(
                article.category
            )}

        </div>

        <h1 class="article-title">

            ${escapeHTML(
                article.title
            )}

        </h1>

        <div class="article-meta">

            <span>

                ${escapeHTML(
                    article.source
                )}

            </span>

            <span>
                •
            </span>

            <span>

                ${escapeHTML(
                    article.time
                )}

            </span>

            <span>
                •
            </span>

            <span>

                ${saved
                    ? "★ Saved"
                    : "News"}

            </span>

        </div>

        <img
            class="article-image"
            src="${escapeHTML(article.image)}"
            alt=""
            onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}'"
        >

        <div class="article-description">

            ${escapeHTML(
                article.description
            )}

        </div>

        <div class="article-buttons">

            <a
                class="read-original"
                href="${escapeHTML(article.url)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                Read Full Article →

            </a>


            <a
                class="whatsapp-share"
                href="#"
                onclick="shareWhatsApp(event, '${escapeJS(article.id)}')"
            >

                <img
                    class="whatsapp-logo"
                    src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
                    alt="WhatsApp"
                >

                SHARE ON WHATSAPP

            </a>

        </div>

    `;

    document
        .getElementById(
            "articleView"
        )
        .classList.add("active");

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   CLOSE ARTICLE
========================================================= */

function closeArticle(){

    document
        .getElementById(
            "articleView"
        )
        .classList.remove("active");

    document.body.style.overflow =
        "";

    /*
     * Remove article hash when going back.
     */
    if(
        window.location.hash
            .startsWith("#article=")
    ){

        history.replaceState(
            null,
            "",
            window.location.pathname +
            window.location.search
        );

    }

}


/* =========================================================
   WHATSAPP SHARE
========================================================= */

function shareWhatsApp(event,id){

    event.preventDefault();

    const article =
        articles.find(
            function(item){

                return String(item.id) ===
                       String(id);

            }
        );

    if(!article){

        showToast(
            "Article not found"
        );

        return;

    }


    /*
     * IMPORTANT:
     *
     * We ONLY put the article ID in the URL.
     *
     * We DO NOT put the title, description,
     * image, source, etc. in the URL.
     *
     * This keeps the shared link very short.
     */

    const shortLink =
        window.location.origin +
        window.location.pathname +
        "#article=" +
        encodeURIComponent(
            article.id
        );


    const message =
        "📰 " +
        article.title +
        "\n\n" +
        "Read this news on VarthaNow 👇\n" +
        shortLink;


    const whatsappURL =
        "https://wa.me/?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   CHECK SHARED ARTICLE
========================================================= */

function checkSharedArticle(){

    const hash =
        window.location.hash;

    if(
        !hash.startsWith("#article=")
    ){

        return;

    }


    const encodedId =
        hash.substring(
            "#article=".length
        );


    if(!encodedId){

        return;

    }


    let articleId = "";

    try{

        articleId =
            decodeURIComponent(
                encodedId
            );

    }
    catch(error){

        articleId =
            encodedId;

    }


    if(!articleId){

        return;

    }


    /*
     * Wait until NewsData articles are available.
     */

    const article =
        articles.find(
            function(item){

                return String(item.id) ===
                       String(articleId);

            }
        );


    if(article){

        openArticle(
            article.id
        );

    }

}

/* =========================================================
   SAVE ARTICLE
========================================================= */

function toggleSave(id){

    if(
        savedArticles.includes(id)
    ){

        savedArticles =
            savedArticles.filter(
                function(item){

                    return item !== id;

                }
            );

        showToast(
            "Removed from saved"
        );

    }
    else{

        savedArticles.push(id);

        showToast(
            "Article saved ⭐"
        );

    }

    localStorage.setItem(
        "savedArticles",
        JSON.stringify(
            savedArticles
        )
    );

    renderNews();

}

/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(dateString){

    if(!dateString){

        return "Recently";

    }

    const date =
        new Date(dateString);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Recently";

    }

    const now =
        new Date();

    const difference =
        Math.floor(
            (
                now - date
            ) / 60000
        );

    if(difference < 1){

        return "Just now";

    }

    if(difference < 60){

        return `${difference} min ago`;

    }

    const hours =
        Math.floor(
            difference / 60
        );

    if(hours < 24){

        return `${hours} hr${hours > 1 ? "s" : ""} ago`;

    }

    const days =
        Math.floor(
            hours / 24
        );

    if(days < 7){

        return `${days} day${days > 1 ? "s" : ""} ago`;

    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short"
        }
    );

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(text){

    if(!text){

        return "";

    }

    return text.charAt(0).toUpperCase()
        + text.slice(1);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   JAVASCRIPT STRING ESCAPE
========================================================= */

function escapeJS(text){

    return String(text)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        )

        .replaceAll(
            "\n",
            "\\n"
        )

        .replaceAll(
            "\r",
            "\\r"
        );

}
